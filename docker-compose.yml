version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: dbd_guard_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=dbd_guard
    ports:
      - "5433:5432"
    volumes:
      - dbd_guard_data:/var/lib/postgresql/data
    restart: always

volumes:
  dbd_guard_data:
